{{- /* Cookie Consent Banner */ -}}
<div id="cookie-banner" style="display:none;position:fixed;bottom:0;left:0;right:0;background:var(--entry);border-top:1px solid var(--border);padding:12px 24px;z-index:9999;font-size:14px;">
    <div style="max-width:calc(var(--main-width) + var(--gap) * 2);margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
        <span style="color:var(--content);line-height:1.5;">
            {{- if eq .Site.Language.Lang "zh" -}}
            本网站使用 Cookie 和广告技术来改善体验。继续使用即表示您同意我们的
            <a href="{{ absLangURL "privacy" }}" style="color:var(--primary);text-decoration:underline;">隐私政策</a>。
            {{- else -}}
            This website uses cookies and advertising technology to improve your experience. By continuing, you agree to our
            <a href="{{ absLangURL "privacy" }}" style="color:var(--primary);text-decoration:underline;">Privacy Policy</a>.
            {{- end -}}
        </span>
        <button onclick="acceptCookies()" style="padding:6px 18px;background:var(--primary);color:var(--theme);border:none;border-radius:var(--radius);cursor:pointer;font-size:14px;white-space:nowrap;">
            {{- if eq .Site.Language.Lang "zh" -}}同意{{- else -}}Accept{{- end -}}
        </button>
    </div>
</div>

<script>
    function acceptCookies() {
        localStorage.setItem('cookie-consent', 'accepted');
        document.getElementById('cookie-banner').style.display = 'none';
    }

    // Show banner if not yet accepted
    if (!localStorage.getItem('cookie-consent')) {
        document.getElementById('cookie-banner').style.display = 'block';
    }
</script>
