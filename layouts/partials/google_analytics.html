{{- /* Google Analytics 4 (GA4) tracking code */ -}}
{{- if site.Params.analytics.google.measurementID -}}
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.Params.analytics.google.measurementID }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ site.Params.analytics.google.measurementID }}');
</script>
{{- end -}}
